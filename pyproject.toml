[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "civitai-widget"
dynamic = ["version"]
description = "Translucent desktop widget that shows trending AI art from Civitai"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
civitai-widget = "civitai_widget.app:main"

[tool.setuptools.packages.find]
include = ["civitai_widget*"]

[tool.setuptools.dynamic]
version = { attr = "civitai_widget.__version__" }

[tool.setuptools.package-data]
civitai_widget = ["assets/*.svg"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
